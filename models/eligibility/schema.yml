version: 2

models:
  - name: eligibility_check
    description: Per-record eligibility decision with reason for ineligibility
    columns:
      - name: ticket_id
        tests:
          - not_null
      - name: is_eligible
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
