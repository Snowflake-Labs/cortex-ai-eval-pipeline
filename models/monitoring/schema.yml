version: 2

models:
  - name: run_history
    description: Historical run-level metrics for trend analysis and drift detection
    columns:
      - name: run_id
        tests:
          - not_null
          - unique
      - name: gate_result
        tests:
          - not_null

  - name: retroactive_accuracy
    description: Accuracy against delayed human labels, per published run / model / prompt_version
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['run_id', 'model_name', 'prompt_version']
    columns:
      - name: run_id
        tests:
          - not_null
      - name: retroactive_accuracy
        tests:
          - not_null
