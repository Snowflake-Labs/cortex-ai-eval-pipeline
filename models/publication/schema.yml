version: 2

models:
  - name: published_predictions
    description: >
      Append-only log of trusted output. Each run's predictions are added only if
      the run passed the quality gate; a FAIL run adds nothing and earlier batches are kept.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['ticket_id', 'run_id']
    columns:
      - name: ticket_id
        tests:
          - not_null
      - name: run_id
        tests:
          - not_null
      - name: predicted_category
        tests:
          - not_null
      - name: gate_result
        tests:
          - accepted_values:
              arguments:
                values: ['PASS']

  - name: current_predictions
    description: Latest published prediction per ticket (view over published_predictions)
    columns:
      - name: ticket_id
        tests:
          - not_null
          - unique
