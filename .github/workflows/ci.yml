name: CI - Offline Evaluation Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: .
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_DATABASE: LLM_PIPELINE_CI
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install ruff==0.9.10
      - name: Python Lint
        run: ruff check models/ scripts/

      # Before dbt deps/parse, which create untracked files (dbt_packages/,
      # package-lock.yml, .user.yml) that addlicense would otherwise scan.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: 'stable'
      - run: go install github.com/google/addlicense@v1.2.0
      - name: License headers
        run: addlicense -check -c "Snowflake Inc." -l apache -ignore "seeds/**" .

      # Catches broken refs, YAML and Jinja without touching Snowflake.
      # env_var() needs every variable set, so placeholders are enough here.
      - run: pip install -r requirements.txt --require-hashes
      - run: dbt deps
      - name: dbt parse
        env:
          SNOWFLAKE_ACCOUNT: placeholder
          SNOWFLAKE_USER: placeholder
          SNOWFLAKE_ROLE: placeholder
          SNOWFLAKE_PRIVATE_KEY_PATH: /dev/null
        run: dbt parse --target ci

  offline-evaluation-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    # Fork PRs get no repository secrets, so they run lint only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # All PRs build into the same LLM_PIPELINE_CI schemas, so only one
    # Snowflake run may execute at a time across the whole repo.
    concurrency:
      group: ci-snowflake-llm-pipeline-ci
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Write private key file
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8 && chmod 600 /tmp/snowflake_key.p8

      - run: pip install -r requirements.txt --require-hashes
      - run: dbt deps

      - name: Seed and build (offline evaluation only)
        run: |
          dbt build --target ci --full-refresh --exclude tag:runtime tag:monitoring

      - name: Check for regressions (offline evaluation)
        run: python scripts/check_gate.py --mode regression

      - name: Cleanup secrets
        if: always()
        run: rm -f /tmp/snowflake_key.p8
