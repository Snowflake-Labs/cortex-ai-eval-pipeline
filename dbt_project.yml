name: 'llm_classification_pipeline'
config-version: 2

profile: 'llm_classification'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  llm_model: "mistral-large2"
  eval_llm_model: "claude-sonnet-4-5"
  prompt_version: "v1.0"
  min_text_length: 20
  supported_languages: ["en"]
  # Fixed classification taxonomy; the PROD distribution-shift reference is uniform over these
  categories: ["billing", "account_access", "technical_issue", "product_question", "cancellation", "other"]
  # Inference failure sentinels written to predicted_category; never counted as a class
  error_sentinels: ["PARSE_ERROR", "LLM_ERROR"]

models:
  llm_classification_pipeline:
    # Write model/column descriptions to Snowflake as table/column comments
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: pipeline
      +materialized: view
    profiling:
      +schema: pipeline
      +materialized: table
    eligibility:
      +schema: pipeline
      +materialized: table
    inference:
      +schema: pipeline
      +materialized: table
    evaluation:
      +schema: evaluation
      +materialized: table
    quality_gate:
      +schema: online
      +materialized: table
      +tags: ["runtime"]
    publication:
      +schema: online
      +materialized: table
      +tags: ["runtime"]
    monitoring:
      +schema: monitoring
      +materialized: incremental
      +tags: ["runtime"]
    change_time:
      +schema: offline
      +materialized: table
      +tags: ["change_time"]

seeds:
  llm_classification_pipeline:
    +schema: seeds
    golden_tickets:
      +tags: ["change_time"]
    baseline_metrics:
      +tags: ["change_time"]
    production_tickets:
      +tags: ["runtime"]
    delayed_labels:
      +tags: ["runtime", "monitoring"]
